<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or '综合管廊有偿使用费管理系统' }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/vendor/flatpickr/flatpickr.min.css">
</head>
<body>
<div class="bg-corner" aria-hidden="true"></div>
<div class="mobile-topbar">
    <span class="logo-mark">管</span>
    <span class="mobile-title">管廊收费系统</span>
    <button type="button" class="burger" id="mobile-nav-toggle" aria-label="打开菜单"><span></span><span></span><span></span></button>
</div>
<div class="layout" id="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo" id="sidebar-toggle" title="点击可收起/展开侧边栏"><span class="logo-mark">管</span><span class="logo-text">管廊收费系统</span></div>
        <nav>
            {% set p = request.url.path %}
            <a href="/data-dashboard/" class="{% if p.startswith('/data-dashboard') %}active{% endif %}" title="数据看板">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                <span class="nav-label">数据看板</span></a>
            <a href="/" class="{% if p == '/' %}active{% endif %}" title="首页概览">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
                <span class="nav-label">首页概览</span></a>
            <div class="nav-group open">
                <div class="nav-group-head" title="点击展开/收起" onclick="this.parentElement.classList.toggle('open')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
                    <span class="nav-label">基础信息</span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <div class="nav-sub">
                    <a href="/companies/" class="{% if p.startswith('/companies') %}active{% endif %}" title="单位管理">单位管理</a>
                    <a href="/pipeline-entries/" class="{% if p.startswith('/pipeline-entries') %}active{% endif %}" title="入廊管线清单">入廊管线清单</a>
                    <a href="/fee-standards/" class="{% if p.startswith('/fee-standards') %}active{% endif %}" title="收费标准">收费标准</a>
                </div>
            </div>
            <div class="nav-group open">
                <div class="nav-group-head" title="点击展开/收起" onclick="this.parentElement.classList.toggle('open')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/></svg>
                    <span class="nav-label">收费管理</span>
                    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </div>
                <div class="nav-sub">
                    <a href="/fee-records/" class="{% if p.startswith('/fee-records') %}active{% endif %}" title="收费记录">收费记录</a>
                    <a href="/fee-summary/" class="{% if p.startswith('/fee-summary') %}active{% endif %}" title="收费汇总">收费汇总</a>
                    <a href="/feasibility-subsidy/" class="{% if p.startswith('/feasibility-subsidy') %}active{% endif %}" title="可行性缺口补助">可行性缺口补助</a>
                </div>
            </div>
            <a href="/contracts/" class="{% if p.startswith('/contracts') %}active{% endif %}" title="合同备案">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                <span class="nav-label">合同备案</span></a>
            <a href="/settings/reminders" class="{% if p.startswith('/settings') %}active{% endif %}" title="提醒设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                <span class="nav-label">提醒设置</span></a>
        </nav>
    </aside>
    <main class="content">
        <header class="page-header">
            <div class="page-header-bar">
                <h2>{{ title }}</h2>
                {% if request.state.user %}
                <div class="page-header-actions">
                    <span class="user-badge">已登录：{{ request.state.user }}</span>
                    <form method="post" action="/logout" style="display:inline;margin:0" onsubmit="return confirm('确定要退出登录吗？');">
                        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
                        <button type="submit" class="logout-btn" title="退出登录">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
                            退出登录
                        </button>
                    </form>
                </div>
                {% endif %}
            </div>
        </header>
        {% block content %}{% endblock %}
    </main>
</div>
<script>
(function () {
    const layout = document.getElementById('app-layout');
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('sidebar-toggle');
    const storageKey = 'sidebar-collapsed';

    if (!layout || !sidebar || !toggle) {
        return;
    }

    const applyState = (collapsed) => {
        layout.classList.toggle('sidebar-collapsed', collapsed);
        sidebar.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    };

    applyState(window.localStorage.getItem(storageKey) === 'true');

    const toggleSidebar = () => {
        const collapsed = !layout.classList.contains('sidebar-collapsed');
        applyState(collapsed);
        window.localStorage.setItem(storageKey, String(collapsed));
    };

    toggle.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleSidebar();
    });

    const mobileToggle = document.getElementById('mobile-nav-toggle');
    if (mobileToggle) {
        mobileToggle.addEventListener('click', () => {
            const opening = !layout.classList.contains('mobile-nav-open');
            layout.classList.toggle('mobile-nav-open');
            if (opening) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    }

    sidebar.addEventListener('click', (event) => {
        if (!layout.classList.contains('sidebar-collapsed')) {
            return;
        }
        // 收起状态下点图标直接跳转，不展开；点其他空白处展开
        if (event.target.closest('a')) {
            return;
        }
        toggleSidebar();
    });
})();
</script>
<script src="/static/vendor/flatpickr/flatpickr.min.js"></script>
<script src="/static/vendor/flatpickr/zh.js"></script>
<script>
// 全局日期选择器：把所有原生 date 输入换成 flatpickr（中文、YYYY-MM-DD）
(function () {
    function initDatePickers(root) {
        if (typeof flatpickr === 'undefined') return;
        (root || document).querySelectorAll('input[type="date"]').forEach(function (el) {
            if (el._flatpickr) return;
            el.type = 'text';
            el.placeholder = el.placeholder || '年-月-日';
            el.autocomplete = 'off';
            flatpickr(el, {
                locale: 'zh',
                dateFormat: 'Y-m-d',
                allowInput: true,
                disableMobile: true
            });
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () { initDatePickers(); });
    } else {
        initDatePickers();
    }
    // 兼容后续动态插入的日期框
    new MutationObserver(function (muts) {
        muts.forEach(function (m) {
            m.addedNodes.forEach(function (n) {
                if (n.nodeType === 1) initDatePickers(n);
            });
        });
    }).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body>
</html>
