{% extends 'base.html' %}
{% block content %}
<section class="panel form-panel">
    <form method="post" action="{% if contract %}/contracts/{{ contract.id }}/edit{% else %}/contracts/new{% endif %}" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <input type="hidden" name="pipeline_entry_id" id="pipeline_entry_id" value="{{ contract.pipeline_entry_id if contract and contract.pipeline_entry_id else '' }}">
        <label>所属单位
            <select name="company_id" id="company_id" required>
                {% for company in companies %}
                <option value="{{ company.id }}" {% if contract and contract.company_id == company.id %}selected{% endif %}>{{ company.short_name or company.company_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>合同类型
            <select name="contract_type" id="contract_type">
                <option value="">请选择</option>
                <option value="入廊合同" {% if contract and contract.contract_type == '入廊合同' %}selected{% endif %}>入廊合同</option>
                <option value="运维合同" {% if contract and contract.contract_type == '运维合同' %}selected{% endif %}>运维合同</option>
                {% if contract and contract.contract_type and contract.contract_type not in ['入廊合同', '运维合同'] %}
                <option value="{{ contract.contract_type }}" selected>{{ contract.contract_type }}</option>
                {% endif %}
            </select>
        </label>
        <label>合同名称
            <select name="contract_name" id="contract_name" required>
                <option value="">请选择项目</option>
                {% for e in pipeline_entries %}
                <option value="{{ e.project_name }}" data-entry-id="{{ e.id }}" {% if contract and contract.contract_name == e.project_name %}selected{% endif %}>{{ e.project_name }}（{{ e.company.short_name or e.company.company_name if e.company else '' }}）</option>
                {% endfor %}
                {% if contract and contract.contract_name and contract.contract_name not in project_names %}
                <option value="{{ contract.contract_name }}" selected>{{ contract.contract_name }}</option>
                {% endif %}
            </select>
        </label>
        <label>签订时间<input name="sign_date" id="sign_date" type="date" value="{{ contract.sign_date if contract and contract.sign_date else '' }}"></label>
        <label>备案部门<input name="filing_department" value="{{ contract.filing_department if contract else '' }}"></label>
        <label>备案状态
            <select name="filing_status" id="filing_status">
                <option value="">请选择</option>
                <option value="未备案" {% if contract and contract.filing_status == '未备案' %}selected{% endif %}>未备案</option>
                <option value="已备案" {% if contract and contract.filing_status == '已备案' %}selected{% endif %}>已备案</option>
                <option value="未签订" {% if contract and contract.filing_status == '未签订' %}selected{% endif %}>未签订</option>
                {% if contract and contract.filing_status and contract.filing_status not in ['未备案', '已备案', '未签订'] %}
                <option value="{{ contract.filing_status }}" selected>{{ contract.filing_status }}</option>
                {% endif %}
            </select>
        </label>
        <label class="full">备注<textarea name="remark" rows="4">{{ contract.remark if contract else '' }}</textarea></label>
        <div class="full">
            <button type="submit">保存</button>
            <a class="button secondary" href="/contracts/">取消</a>
        </div>
    </form>
</section>
<script>
(function () {
    var ENTRIES = {{ entries_json | safe }};
    var entryIdInput = document.getElementById('pipeline_entry_id');
    var companySel = document.getElementById('company_id');
    var typeSel = document.getElementById('contract_type');
    var nameSel = document.getElementById('contract_name');
    var dateInput = document.getElementById('sign_date');

    function findEntry(id) {
        for (var i = 0; i < ENTRIES.length; i++) {
            if (String(ENTRIES[i].id) === String(id)) return ENTRIES[i];
        }
        return null;
    }
    function fillFromEntry(entry) {
        if (!entry) return;
        for (var i = 0; i < companySel.options.length; i++) {
            if (companySel.options[i].value === String(entry.company_id)) {
                companySel.selectedIndex = i;
                break;
            }
        }
        var t = typeSel.value || '';
        if (t.indexOf('入廊') !== -1 && entry.sign_date_entry) {
            dateInput.value = entry.sign_date_entry;
        } else if ((t.indexOf('运维') !== -1 || t.indexOf('维护') !== -1) && entry.sign_date_maintenance) {
            dateInput.value = entry.sign_date_maintenance;
        }
    }
    nameSel.addEventListener('change', function () {
        var opt = nameSel.options[nameSel.selectedIndex];
        var eid = opt ? opt.getAttribute('data-entry-id') : '';
        entryIdInput.value = eid || '';
        fillFromEntry(findEntry(eid));
    });
    typeSel.addEventListener('change', function () {
        fillFromEntry(findEntry(entryIdInput.value));
    });
})();
</script>
{% endblock %}
